{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<h1>Teacher log in</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
</form>
<p><a href="{% url 'signup' %}">Need an account? Sign up</a></p>
{% endblock %}
