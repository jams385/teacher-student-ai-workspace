{% extends "base.html" %}

{% block title %}Sign up{% endblock %}

{% block content %}
<h1>Create a teacher account</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Sign up</button>
</form>
<p><a href="{% url 'login' %}">Already have an account? Log in</a></p>
{% endblock %}
