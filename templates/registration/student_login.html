{% extends "base.html" %}

{% block title %}Student log in{% endblock %}

{% block content %}
<h1>Student log in</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Log in</button>
</form>
<p>Don't have an account? <a href="{% url 'student_signup' %}">Sign up</a>.</p>
<p>Just joining for one class, no account needed? <a href="{% url 'student_join' %}">Join with a code</a>.</p>
{% endblock %}
