{% extends "base.html" %}

{% block title %}{{ workspace.name }}{% endblock %}

{% block content %}
<h1>{{ workspace.name }}</h1>
<p>Mode: {{ workspace.get_mode_display }}</p>
<p>Chatting as <strong>{{ student_session.display_name }}</strong></p>

<div id="message-list">
    {% include 'workspaces/partials/_messages.html' %}
</div>

<form
    hx-post="{% url 'send_message' %}"
    hx-target="#message-list"
    hx-swap="beforeend"
    hx-on="htmx:afterRequest: this.reset()"
>
    {% csrf_token %}
    <input type="text" name="message" placeholder="Ask a question..." required autocomplete="off">
    <button type="submit">Send</button>
</form>
{% endblock %}
