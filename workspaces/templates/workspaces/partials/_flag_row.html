<tr id="flag-row-{{ flag.pk }}" class="{% if flag.reviewed %}flag-reviewed{% else %}flag-unreviewed{% endif %}">
    <td>{{ flag.message.student_session.display_name }}</td>
    <td><span class="badge badge--error">{{ flag.matched_text }}</span></td>
    <td class="flag-row__message">{{ flag.message.content|truncatechars:120 }}</td>
    <td>{{ flag.created_at|date:"M j, Y g:i A" }}</td>
    <td class="material-table__actions-col">
        <div class="table-actions">
            <a href="{% url 'session_transcript' pk=workspace.pk session_pk=flag.message.student_session_id %}" class="table-link">View transcript</a>
            {% if flag.reviewed %}
                <span class="flag-row__reviewed-label">Reviewed</span>
            {% else %}
                <form
                    hx-post="{% url 'flag_mark_reviewed' pk=workspace.pk flag_pk=flag.pk %}"
                    hx-target="#flag-row-{{ flag.pk }}"
                    hx-swap="outerHTML"
                >
                    {% csrf_token %}
                    <button type="submit" class="table-link">Mark reviewed</button>
                </form>
            {% endif %}
        </div>
    </td>
</tr>
