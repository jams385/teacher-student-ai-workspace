<tr id="flag-row-{{ flag.pk }}" class="{% if flag.reviewed %}flag-reviewed{% else %}flag-unreviewed{% endif %}">
    <td>{{ flag.message.student_session.display_name }}</td>
    <td>&#8220;{{ flag.matched_text }}&#8221;</td>
    <td>{{ flag.message.content|truncatechars:120 }}</td>
    <td>{{ flag.created_at|date:"M j, Y g:i A" }}</td>
    <td>
        <a href="{% url 'session_transcript' pk=workspace.pk session_pk=flag.message.student_session_id %}">View transcript</a>
    </td>
    <td>
        {% if flag.reviewed %}
            <span class="text-muted">Reviewed</span>
        {% else %}
            <form
                class="inline-form"
                hx-post="{% url 'flag_mark_reviewed' pk=workspace.pk flag_pk=flag.pk %}"
                hx-target="#flag-row-{{ flag.pk }}"
                hx-swap="outerHTML"
            >
                {% csrf_token %}
                <button type="submit" class="btn-secondary">Mark reviewed</button>
            </form>
        {% endif %}
    </td>
</tr>
