{% extends "base.html" %}

{% block title %}Delete account{% endblock %}

{% block content %}
<h1>Delete account</h1>
<p>This permanently deletes your account. Your chat history is not deleted — teachers can still see it. This cannot be undone.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Permanently delete my account</button>
</form>
{% endblock %}
